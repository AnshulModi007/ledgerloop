# LedgerLoop configuration. Every threshold used by the pipeline lives here —
# none are hardcoded in source. This file is hashed into the audit log so any
# run is reproducible from its report alone (see src/ledgerloop/audit/log.py).

# --- generation ---------------------------------------------------------
# NOTE on volume: the brief's illustrative "~120 bank credits" and "every defect
# class >= 20 times" are in tension -- 8 batch-level defect classes at 20
# instances each is already >= 160 bank lines before CLEAN or padding volume is
# counted. We hold the >= 20-per-class floor (it's the acceptance criterion)
# and let bank-credit count land wherever that implies; bulk padding volume is
# folded into extra BATCH_N1-shaped batches (many txns settling as one credit)
# rather than thousands of 1:1 CLEAN lines, which keeps the line count from
# exploding while still hitting n_gateway_transactions. See data/README.md.
generate:
  dev_seed: 42
  holdout_seed: 1337
  n_gateway_transactions: 5000
  # The scale profile exists only to measure where the pure-Python subset-sum search
  # stops holding up (eval/scale.py). It is generated on demand, never committed, and
  # never scored as an accuracy claim -- dev and holdout are the graded sets.
  scale_seed: 90210
  scale_n_gateway_transactions: 50000
  # Defect instances scale with volume too. Left at 20 while transactions grow 10x, the
  # scale profile would get *easier* than dev (same hard cases diluted across more clean
  # ones) and the benchmark would measure nothing worth measuring.
  scale_min_instances_per_defect: 200
  # --- generalization suite (generate/novel.py) ---------------------------------
  # Defect shapes the matcher was never designed for. Small on purpose: the suite is
  # scored on whether anything is matched WRONGLY, not on volume, and every case is
  # meant to be readable by hand when one of them fails.
  novel_seed: 31337
  novel_instances_per_shape: 8
  novel_clean_controls: 12
  novel_wire_fee_paise: 11800 # INR 118.00 -- a typical RTGS charge plus GST
  min_instances_per_defect: 20
  start_date: "2026-01-01"
  end_date: "2026-03-31"
  bulk_batch_min_size: 20
  bulk_batch_max_size: 90

# --- fee model (match/fee_model.py) -------------------------------------
fee:
  platform_fee_bps: 200 # 2.00% of gross, charged by the gateway
  gst_rate_bps: 1800 # 18.00% GST on the platform fee
  tds_bps: 10 # 0.10% TDS on gross (u/s 194-O), configurable per merchant

# --- tier 1: exact join ---------------------------------------------------
# "no tolerance" means no amount slack, but a same/next-day settlement->bank
# posting lag is a structural fact of how payouts clear, not a fuzzy fudge --
# so it's bounded and configurable rather than open-ended.
tier1:
  exact_match_max_lag_days: 1

# --- tier 2: algorithmic matching ---------------------------------------
# meet_in_middle_max_items and subset_sum_node_budget were both tuned down from an
# initial 40 / 200,000: profiling showed 2^20 combinations per half at n=40 (~1M
# subset sums, pure Python) and a 200k-iteration greedy search both dominating
# pipeline runtime whenever a candidate window had no valid subset at all (the
# search correctly burns its whole budget before giving up). At 20 / 20,000 the
# dev-set resolution/false-match numbers are unchanged -- see FAILURES.md.
tier2:
  amount_tolerance_paise: 200 # +/- INR 2.00 slack for FEE_DRIFT-class rounding
  date_window_days: 5 # settlement is T+2; window absorbs MONTH_CROSS
  subset_sum_node_budget: 20000 # hard cap before emitting TIER2_TIMEOUT
  meet_in_middle_max_items: 20 # above this, fall back to greedy + local search
  min_resolve_score: 0.7 # below this, defer to tier3 even if the candidate is unique
  ambiguity_margin: 0.05 # candidates within this of the best score are treated as tied
  matcher_rng_seed: 777 # seeds tier2's own tie-breaking RNG (greedy local search); unrelated to generation seeds

# --- tier 3: LLM adjudication -------------------------------------------
tier3:
  confidence_threshold: 0.85 # below this, override decision to abstain
  max_retries: 2
  batch_size: 20 # ambiguous cases grouped per LLM call
  max_calls_per_run: 400 # target ceiling for a 5,000-record batch

# --- exceptions / journal -------------------------------------------------
exceptions:
  suspected_duplicate_window_days: 3

eval:
  false_match_rate_gate: 0.01 # CI fails the build above this
  auto_match_rate_gate: 0.80 # CI fails the build below this
