# LedgerLoop configuration. Every threshold used by the pipeline lives here —
# none are hardcoded in source. This file is hashed into the audit log so any
# run is reproducible from its report alone (see src/ledgerloop/audit/log.py).

# --- generation ---------------------------------------------------------
# NOTE on volume: the brief's illustrative "~120 bank credits" and "every defect
# class >= 20 times" are in tension -- 8 batch-level defect classes at 20
# instances each is already >= 160 bank lines before CLEAN or padding volume is
# counted. We hold the >= 20-per-class floor (it's the acceptance criterion)
# and let bank-credit count land wherever that implies; bulk padding volume is
# folded into extra BATCH_N1-shaped batches (many txns settling as one credit)
# rather than thousands of 1:1 CLEAN lines, which keeps the line count from
# exploding while still hitting n_gateway_transactions. See data/README.md.
generate:
  dev_seed: 42
  holdout_seed: 1337
  n_gateway_transactions: 5000
  min_instances_per_defect: 20
  start_date: "2026-01-01"
  end_date: "2026-03-31"
  bulk_batch_min_size: 20
  bulk_batch_max_size: 90

# --- fee model (match/fee_model.py) -------------------------------------
fee:
  platform_fee_bps: 200 # 2.00% of gross, charged by the gateway
  gst_rate_bps: 1800 # 18.00% GST on the platform fee
  tds_bps: 10 # 0.10% TDS on gross (u/s 194-O), configurable per merchant

# --- tier 2: algorithmic matching ---------------------------------------
tier2:
  amount_tolerance_paise: 200 # +/- INR 2.00 slack for FEE_DRIFT-class rounding
  date_window_days: 5 # settlement is T+2; window absorbs MONTH_CROSS
  subset_sum_node_budget: 200000 # hard cap before emitting TIER2_TIMEOUT
  meet_in_middle_max_items: 40 # above this, fall back to greedy + local search

# --- tier 3: LLM adjudication -------------------------------------------
tier3:
  confidence_threshold: 0.85 # below this, override decision to abstain
  max_retries: 2
  batch_size: 20 # ambiguous cases grouped per LLM call
  max_calls_per_run: 400 # target ceiling for a 5,000-record batch

# --- exceptions / journal -------------------------------------------------
exceptions:
  suspected_duplicate_window_days: 3

eval:
  false_match_rate_gate: 0.01 # CI fails the build above this
  auto_match_rate_gate: 0.80 # CI fails the build below this
