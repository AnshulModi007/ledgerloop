[project]
name = "ledgerloop"
version = "0.1.0"
description = "Multi-source settlement reconciliation agent (Razorpay AI Buildathon 2026, Track 04)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
llm = [
    "google-generativeai>=0.5",
    "groq>=0.5",
]
ui = [
    "streamlit>=1.32",
]

[project.scripts]
ledgerloop = "ledgerloop.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
