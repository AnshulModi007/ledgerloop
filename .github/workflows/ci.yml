name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test suite
        run: python -m pytest

      - name: Generate dev + holdout data
        run: python -m ledgerloop.generate.generator --profile all

      # Phases 2-5 add: --no-llm end-to-end run, eval harness threshold gates
      # (false-match rate <= 1%, auto-match rate >= 80%), determinism re-run
      # diff, and the injection test suite. Wired in as each phase lands.
