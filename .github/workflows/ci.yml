name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test suite
        run: python -m pytest

      - name: Generate dev + holdout data
        run: python -m ledgerloop.generate.generator --profile all

      - name: --no-llm end-to-end run (zero-key demo path)
        run: python -m ledgerloop.reconcile --profile dev --no-llm --approve

      - name: Re-run shows zero new postings (idempotency, live)
        run: python -m ledgerloop.reconcile --profile dev --no-llm --approve | grep -q "0 new postings recorded"

      # Phase 5 adds: eval harness threshold gates (false-match rate <= 1%,
      # auto-match rate >= 80%) run against this same --no-llm path. Wired in as
      # that phase lands. Determinism (test_determinism.py) and injection defence
      # (test_injection.py) are already exercised above via `pytest`.
