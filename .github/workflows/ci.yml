name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev,ui]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test suite
        run: python -m pytest

      - name: Generate dev + holdout data
        run: python -m ledgerloop.generate.generator --profile all

      - name: --no-llm end-to-end run (zero-key demo path)
        run: python -m ledgerloop.reconcile --profile dev --no-llm --approve

      - name: Re-run shows zero new postings (idempotency, live)
        run: python -m ledgerloop.reconcile --profile dev --no-llm --approve | grep -q "0 new postings recorded"

      - name: Eval harness threshold gates (false-match <= 1%, auto-match >= 80%)
        run: python -m ledgerloop.eval.metrics --profile dev --no-llm

      # Defect shapes the matcher was never designed for. Fails the build only on a
      # WRONG match -- escalating every novel line is a correct outcome and passes.
      - name: Generalization suite (no novel shape may be matched wrongly)
        run: python -m ledgerloop.eval.generalization

      - name: Determinism check (run twice, diff the reports)
        run: |
          python -m ledgerloop.eval.metrics --profile dev --no-llm --runs-root runs/det_a
          python -m ledgerloop.eval.metrics --profile dev --no-llm --runs-root runs/det_b
          python -c "
          import json, sys
          def load(p):
              d = json.load(open(p))
              d.pop('throughput_records_per_sec', None)  # wall-clock, not a correctness signal
              return d
          a = load('runs/det_a/dev_eval_metrics.json')
          b = load('runs/det_b/dev_eval_metrics.json')
          if a != b:
              print('DETERMINISM CHECK FAILED: two --no-llm runs over identical inputs diverged')
              print('run a:', a)
              print('run b:', b)
              sys.exit(1)
          print('determinism check passed: identical reports across two independent runs')
          "

      # Unit-level determinism (test_determinism.py), injection defence
      # (test_injection.py), and the holdout honesty rule (test_holdout_honesty.py)
      # are already exercised above via `pytest`.
